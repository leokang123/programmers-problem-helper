name: Publish Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish. Leave empty to use the latest GitHub Release."
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi

          gh release view "$TAG" > /dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing release asset from $TAG"

      - name: Download release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p dist
          gh release download "$TAG" --pattern "*.vsix" --dir dist --clobber

          VSIX_COUNT="$(find dist -maxdepth 1 -name '*.vsix' | wc -l | tr -d ' ')"
          if [ "$VSIX_COUNT" != "1" ]; then
            echo "Expected exactly one VSIX asset in release $TAG, found $VSIX_COUNT."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          VSIX_PATH="$(find dist -maxdepth 1 -name '*.vsix' -print -quit)"
          echo "VSIX_PATH=$VSIX_PATH" >> "$GITHUB_ENV"
          echo "Downloaded $VSIX_PATH"

      - name: Publish VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          npx @vscode/vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
