name: Package VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npx @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: programmers-problem-helper-vsix
          path: "*.vsix"
